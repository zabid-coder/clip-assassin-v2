# GitHub Actions CI/CD for Clip Assassin
# Builds macOS .dmg and Windows .exe installer

name: Build Desktop Apps

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-macos:
    runs-on: macos-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Install npm dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Build macOS app with PyInstaller
      run: |
        pyinstaller --noconfirm --clean --windowed \
          --name="Clip Assassin" \
          --icon=app_icon.icns \
          --osx-bundle-identifier=com.zabidstudio.clipassassin \
          --target-architecture=universal2 \
          --add-data="frontend/dist:frontend/dist" \
          --add-data="presets:presets" \
          --add-data="templates:templates" \
          --collect-all=pywebview \
          --collect-all=uvicorn \
          --collect-all=fastapi \
          desktop_app.py

    - name: Create DMG
      run: |
        # Create DMG contents
        mkdir dist/dmg_contents
        cp -r "dist/Clip Assassin.app" dist/dmg_contents/
        ln -s /Applications dist/dmg_contents/Applications
        
        # Create DMG
        hdiutil create -volname "Clip Assassin" \
          -srcfolder dist/dmg_contents \
          -ov -format UDRO dist/temp.dmg
        
        # Compress DMG
        hdiutil convert dist/temp.dmg \
          -format UDZO -imagekey zlib-level=9 \
          -o "dist/Clip_Assassin_${{ github.ref_name }}.dmg"
        
        rm dist/temp.dmg
        rm -rf dist/dmg_contents

    - name: Upload macOS DMG
      uses: actions/upload-artifact@v4
      with:
        name: clip-assassin-macos
        path: dist/Clip_Assassin_*.dmg

  build-windows:
    runs-on: windows-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller pywebview

    - name: Install npm dependencies
      run: |
        cd frontend
        npm ci

    - name: Build frontend
      run: |
        cd frontend
        npm run build

    - name: Build Windows executable with PyInstaller
      run: |
        pyinstaller --noconfirm --clean --windowed `
          --name="Clip Assassin" `
          --icon=icon.ico `
          --add-data="frontend/dist;frontend/dist" `
          --add-data="presets;presets" `
          --add-data="templates;templates" `
          --collect-all=pywebview `
          --collect-all=uvicorn `
          --collect-all=fastapi `
          desktop_app.py

    - name: Create Inno Setup Installer
      run: |
        # Download and install Inno Setup
        $issUrl = "https://jrsoftware.org/download/is.exe"
        Invoke-WebRequest -Uri $issUrl -OutFile is.exe
        Start-Process is.exe -ArgumentList "/VERYSILENT" -Wait
        
        # Compile installer
        & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" clip_assassin_installer.iss

    - name: Upload Windows Installer
      uses: actions/upload-artifact@v4
      with:
        name: clip-assassin-windows
        path: dist/Clip_Assassin_*_Setup.exe

  release:
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
    - name: Download macOS artifact
      uses: actions/download-artifact@v4
      with:
        name: clip-assassin-macos
        path: ./artifacts/macos

    - name: Download Windows artifact
      uses: actions/download-artifact@v4
      with:
        name: clip-assassin-windows
        path: ./artifacts/windows

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v1
      with:
        files: |
          ./artifacts/macos/*.dmg
          ./artifacts/windows/*.exe
        body: |
          ## Clip Assassin ${{ github.ref_name }}
          
          ### Downloads
          - **macOS**: Clip_Assassin_${{ github.ref_name }}.dmg
          - **Windows**: Clip_Assassin_${{ github.ref_name }}_Setup.exe
          
          ### Installation
          #### macOS
          1. Download the .dmg file
          2. Open it and drag Clip Assassin to Applications
          3. Right-click → Open to bypass Gatekeeper on first launch
          
          #### Windows
          1. Download the setup.exe file
          2. Run the installer
          3. Launch from Start Menu or Desktop
          
          ### Requirements
          - DaVinci Resolve 17+ must be installed
          - macOS 10.15+ or Windows 10+
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
