# GitHub Actions CI/CD for Clip Assassin
# Builds macOS .dmg and Windows .exe installer

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

# Force Node 24 for all jobs to avoid deprecation warnings
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
      
      - name: Build Frontend (if exists)
        run: |
          if (Test-Path "frontend/package.json") {
            cd frontend
            npm install
            npm run build
            cd ..
          }

      - name: Build Executable with PyInstaller
        run: |
          $iconPath = "assets/icon.ico"
          if (Test-Path $iconPath) {
            Write-Host "Using icon: $iconPath"
            pyinstaller --onefile --windowed --name="ClipAssassin" --icon=$iconPath desktop_app.py
          } else {
            Write-Host "Icon not found, building without icon."
            pyinstaller --onefile --windowed --name="ClipAssassin" desktop_app.py
          }

      - name: Prepare Release
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/ClipAssassin.exe release/
          if (Test-Path README.md) { Copy-Item README.md release/ }
          Compress-Archive -Path release/* -DestinationPath ClipAssassin-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ClipAssassin-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Frontend (if exists)
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm install
            npm run build
            cd ..
          fi

      - name: Build App Bundle with PyInstaller
        run: |
          if [ -f "assets/icon.icns" ]; then
            echo "Using icon: assets/icon.icns"
            pyinstaller --windowed --name="ClipAssassin" --icon=assets/icon.icns desktop_app.py
          else
            echo "Icon not found, building without icon."
            pyinstaller --windowed --name="ClipAssassin" desktop_app.py
          fi

      - name: Prepare Release
        run: |
          mkdir -p release
          cp -r dist/ClipAssassin.app release/
          if [ -f README.md ]; then cp README.md release/; fi
          cd release
          zip -r ../ClipAssassin-macOS.zip .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ClipAssassin-macOS.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./artifacts/windows

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./artifacts/macos

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/windows/ClipAssassin-Windows.zip
            ./artifacts/macos/ClipAssassin-macOS.zip
          body: |
            ## Clip Assassin ${{ github.ref_name }}
            
            ### Downloads
            - **Windows**: [Download ZIP](./ClipAssassin-Windows.zip)
            - **macOS**: [Download ZIP](./ClipAssassin-macOS.zip)
            
            ### Installation
            #### Windows
            1. Unzip `ClipAssassin-Windows.zip`.
            2. Run `ClipAssassin.exe`.
            
            #### macOS
            1. Unzip `ClipAssassin-macOS.zip`.
            2. Drag `ClipAssassin.app` to Applications folder.
            3. Right-click → Open on first launch.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
