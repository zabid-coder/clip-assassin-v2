# GitHub Actions CI/CD for Clip Assassin
# Builds macOS .dmg and Windows .exe installer

name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
      
      - name: Build Frontend (if exists)
        run: |
          if (Test-Path "frontend/package.json") {
            cd frontend
            npm install
            npm run build
            cd ..
          }

      - name: Verify Icon
        id: check_icon
        run: |
          if (Test-Path "assets/icon.ico") {
            echo "ICON_FOUND=true" >> $env:GITHUB_OUTPUT
          } else {
            echo "ICON_FOUND=false" >> $env:GITHUB_OUTPUT
            Write-Warning "icon.ico not found in assets/. Building without icon."
          }

      - name: Build Executable with PyInstaller
        run: |
          if ($env:ICON_FOUND -eq 'true') {
            pyinstaller --onefile --windowed --name="ClipAssassin" --icon=assets/icon.ico desktop_app.py
          } else {
            pyinstaller --onefile --windowed --name="ClipAssassin" desktop_app.py
          }

      - name: Prepare Release
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/ClipAssassin.exe release/
          if (Test-Path README.md) { Copy-Item README.md release/ }
          Compress-Archive -Path release/* -DestinationPath ClipAssassin-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ClipAssassin-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Frontend (if exists)
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm install
            npm run build
            cd ..
          fi

      - name: Verify Icon
        id: check_icon
        run: |
          if [ -f "assets/icon.icns" ]; then
            echo "ICON_FOUND=true" >> $GITHUB_OUTPUT
          else
            echo "ICON_FOUND=false" >> $GITHUB_OUTPUT
            echo "::warning::icon.icns not found in assets/. Building without icon."
          fi

      - name: Build App Bundle with PyInstaller
        run: |
          if [ "$ICON_FOUND" = "true" ]; then
            pyinstaller --windowed --name="ClipAssassin" --icon=assets/icon.icns desktop_app.py
          else
            pyinstaller --windowed --name="ClipAssassin" desktop_app.py
          fi

      - name: Prepare Release
        run: |
          mkdir -p release
          cp -r dist/ClipAssassin.app release/
          if [ -f README.md ]; then cp README.md release/; fi
          cd release
          zip -r ../ClipAssassin-macOS.zip .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ClipAssassin-macOS.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./artifacts/windows

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./artifacts/macos

      - name: Create/Update Release
        id: create_release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          overwrite: true
          files: |
            ./artifacts/windows/ClipAssassin-Windows.zip
            ./artifacts/macos/ClipAssassin-macOS.zip
          body: |
            ## Clip Assassin ${{ github.ref_name }}
            
            ### 📥 Downloads
            - **Windows**: [Download ZIP](./ClipAssassin-Windows.zip)
            - **macOS**: [Download ZIP](./ClipAssassin-macOS.zip)
            
            ### 🚀 Installation
            #### Windows
            1. Unzip `ClipAssassin-Windows.zip`.
            2. Run `ClipAssassin.exe`.
            
            #### macOS
            1. Unzip `ClipAssassin-macOS.zip`.
            2. Drag `ClipAssassin.app` to your Applications folder.
            3. Right-click and select Open on first launch to bypass Gatekeeper.
            
            ### ✨ Features
            - Post Haste-style Master Ingest
            - AI Integration Ready
            - Professional UI/UX
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
