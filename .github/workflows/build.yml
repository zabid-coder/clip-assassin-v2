on:
  workflow_dispatch:
  push:
    branches: [ main ]

name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }

      - name: Build Frontend (if exists)
        run: |
          if (Test-Path "frontend/package.json") {
            cd frontend
            npm install
            npm run build
            cd ..
          }

      - name: Build Executable with PyInstaller
        run: |
          pyinstaller --onefile --windowed --name="ClipAssassin" --icon=assets/icon.ico desktop_app.py 2>$null
          if ($LASTEXITCODE -ne 0) {
            pyinstaller --onefile --windowed --name="ClipAssassin" desktop_app.py
          }

      - name: Prepare Release
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/ClipAssassin.exe release/
          Copy-Item README.md release/
          Compress-Archive -Path release/* -DestinationPath ClipAssassin-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ClipAssassin-Windows.zip

  build-macos:
    runs-on: macos-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Frontend (if exists)
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm install
            npm run build
            cd ..
          fi

      - name: Build App Bundle with PyInstaller
        run: |
          pyinstaller --windowed --name="ClipAssassin" --icon=assets/icon.icns desktop_app.py || \
          pyinstaller --windowed --name="ClipAssassin" desktop_app.py

      - name: Prepare Release
        run: |
          mkdir -p release
          cp -r dist/ClipAssassin.app release/
          cp README.md release/
          cd release
          zip -r ../ClipAssassin-macOS.zip .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ClipAssassin-macOS.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./artifacts/windows

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./artifacts/macos

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/windows/ClipAssassin-Windows.zip
            ./artifacts/macos/ClipAssassin-macOS.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
