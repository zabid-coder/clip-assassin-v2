name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if (Test-Path requirements.txt) { pip install -r requirements.txt }
      
      - name: Build Frontend (if exists)
        run: |
          if (Test-Path "frontend/package.json") {
            cd frontend
            npm install
            npm run build
            cd ..
          }

      - name: Build Executable with PyInstaller
        run: |
          # চেষ্টা করুন আইকন সহ বিল্ড করতে, ব্যর্থ হলে ছাড়া বিল্ড করুন
          $iconPath = "assets/icon.ico"
          if (Test-Path $iconPath) {
            pyinstaller --onefile --windowed --name="ClipAssassin" --icon=$iconPath desktop_app.py
          } else {
            pyinstaller --onefile --windowed --name="ClipAssassin" desktop_app.py
          }

      - name: Prepare Release
        run: |
          New-Item -ItemType Directory -Force -Path release
          Copy-Item dist/ClipAssassin.exe release/
          if (Test-Path README.md) { Copy-Item README.md release/ }
          Compress-Archive -Path release/* -DestinationPath ClipAssassin-Windows.zip

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: ClipAssassin-Windows.zip

  build-macos:
    runs-on: macos-latest  # আপডেট করা হয়েছে: macos-latest ব্যবহার করছে
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Build Frontend (if exists)
        run: |
          if [ -f "frontend/package.json" ]; then
            cd frontend
            npm install
            npm run build
            cd ..
          fi

      - name: Build App Bundle with PyInstaller
        run: |
          # চেষ্টা করুন আইকন সহ বিল্ড করতে, ব্যর্থ হলে ছাড়া বিল্ড করুন
          if [ -f "assets/icon.icns" ]; then
            pyinstaller --windowed --name="ClipAssassin" --icon=assets/icon.icns desktop_app.py
          else
            pyinstaller --windowed --name="ClipAssassin" desktop_app.py
          fi

      - name: Prepare Release
        run: |
          mkdir -p release
          cp -r dist/ClipAssassin.app release/
          if [ -f README.md ]; then cp README.md release/; fi
          cd release
          zip -r ../ClipAssassin-macOS.zip .
          cd ..

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: ClipAssassin-macOS.zip

  create-release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download Windows Build
        uses: actions/download-artifact@v4
        with:
          name: windows-build
          path: ./artifacts/windows

      - name: Download macOS Build
        uses: actions/download-artifact@v4
        with:
          name: macos-build
          path: ./artifacts/macos

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          draft: false
          prerelease: false
          files: |
            ./artifacts/windows/ClipAssassin-Windows.zip
            ./artifacts/macos/ClipAssassin-macOS.zip
          body: |
            ## Clip Assassin ${{ github.ref_name }}
            
            ### 📥 Downloads
            - **Windows**: [Download ZIP](./ClipAssassin-Windows.zip)
            - **macOS**: [Download ZIP](./ClipAssassin-macOS.zip)
            
            ### 🚀 Installation
            #### Windows
            1. ডাউনলোড করা `ClipAssassin-Windows.zip` ফাইলটি আনজিপ করুন।
            2. `ClipAssassin.exe` ফাইলটি রান করুন।
            
            #### macOS
            1. ডাউনলোড করা `ClipAssassin-macOS.zip` ফাইলটি আনজিপ করুন।
            2. `ClipAssassin.app` ফাইলটি Applications ফোল্ডারে নিন।
            3. প্রথমবার রান করার সময় Right-click করে Open করুন।
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
